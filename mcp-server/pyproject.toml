[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "save-mcp"
version = "0.1.0"
description = "Save MCP Server - Connect Claude Desktop, Cursor, and LLMs to your Save bookmarks and clips catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
save-mcp = "save_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["save_mcp"]
